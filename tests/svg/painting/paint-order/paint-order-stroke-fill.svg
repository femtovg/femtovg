<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="100" height="100" viewBox="0 0 100 100">
  <!--
    Spec: SVG 2 § 13.8 ("Controlling paint operation order: the 'paint-order' property")
    Invariant: With paint-order="stroke", a path draws its stroke and then its fill, so the fill covers the inner
               half of the stroke. The fill keeps its fill-rule and each paint keeps its own opacity.
  -->
  <html:link rel="match" href="paint-order-stroke-fill-ref.svg"/>
  <rect width="100" height="100" fill="white"/>
  <rect x="10" y="10" width="30" height="30" fill="red" stroke="blue" stroke-width="10" paint-order="stroke"/>
  <path d="M 55 55 H 90 V 90 H 55 Z M 65 65 H 80 V 80 H 65 Z" fill="green" fill-opacity="0.7" fill-rule="evenodd"
        stroke="blue" stroke-opacity="0.4" stroke-width="6" paint-order="stroke"/>
</svg>
