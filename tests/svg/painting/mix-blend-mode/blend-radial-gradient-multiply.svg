<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #356 Reftest: Radial Gradient with mix-blend-mode: multiply over white backdrop
    Spec: https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: Multiplying any color Cs with pure white backdrop (#FFFFFF, Cb=1.0) yields Cs identically (Cs * 1.0 = Cs).
               Verifies continuous radial gradient evaluation through layer blend shader.
  -->
  <html:link rel="match" href="blend-radial-gradient-multiply-ref.svg"/>
  <defs>
    <radialGradient id="rg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="50%" stop-color="#00FF00"/>
      <stop offset="100%" stop-color="#0000FF"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
  <rect x="20" y="20" width="160" height="160" fill="url(#rg1)" style="mix-blend-mode: multiply;"/>
</svg>
