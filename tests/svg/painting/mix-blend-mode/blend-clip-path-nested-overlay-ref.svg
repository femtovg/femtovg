<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Reference for blend-clip-path-nested-overlay.svg -->
  <defs>
    <clipPath id="outerClip">
      <rect x="30" y="30" width="140" height="140" rx="30" ry="30"/>
    </clipPath>
    <clipPath id="innerClip">
      <circle cx="100" cy="100" r="60"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="#808080"/>
  <g clip-path="url(#outerClip)">
    <rect x="0" y="0" width="200" height="200" fill="#FF8020" clip-path="url(#innerClip)"/>
  </g>
</svg>
