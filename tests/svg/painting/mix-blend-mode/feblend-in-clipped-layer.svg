<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>A flood feBlend chain on a group that is clipped and carries opacity</title>
  <clipPath id="c"><circle cx="100" cy="100" r="60"/></clipPath>
  <filter id="f"><feFlood flood-color="lightblue" result="fl"/><feBlend in="fl" in2="SourceGraphic" mode="multiply"/></filter>
  <rect x="20" y="20" width="140" height="140" fill="green"/>
  <g clip-path="url(#c)" opacity="0.8" filter="url(#f)">
    <rect x="40" y="40" width="120" height="120" fill="orange"/>
  </g>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
