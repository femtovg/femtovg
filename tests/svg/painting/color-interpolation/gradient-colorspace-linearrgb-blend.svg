<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #356 Color Space Reftest: linearRGB Gradient under mix-blend-mode: multiply
    Spec: https://www.w3.org/TR/SVG2/painting.html#ColorInterpolationProperty & https://drafts.fxtf.org/compositing-1/
    Invariant: Gradient interpolated in linearRGB (bright yellow midpoint rgb(188, 188, 0)).
               Blended with mix-blend-mode: multiply over white backdrop (#FFFFFF) computes identical result.
  -->
  <html:link rel="match" href="gradient-colorspace-linearrgb-blend-ref.svg"/>
  <defs>
    <linearGradient id="linGrad" x1="0" y1="0" x2="1" y2="0" color-interpolation="linearRGB">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#00FF00"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
  <rect x="20" y="20" width="160" height="160" fill="url(#linGrad)" style="mix-blend-mode: multiply;"/>
</svg>
