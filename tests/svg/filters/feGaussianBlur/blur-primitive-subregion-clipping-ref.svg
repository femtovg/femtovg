<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Reference for blur-primitive-subregion-clipping.svg -->
  <defs>
    <filter id="full-blur" filterUnits="userSpaceOnUse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
    </filter>
    <clipPath id="subregion-clip">
      <rect x="25" y="25" width="100" height="100"/>
    </clipPath>
  </defs>

  <rect width="200" height="200" fill="#000000"/>
  <!-- The equivalent: full blur clipped by explicit clipPath to [25, 25, 100, 100] -->
  <g clip-path="url(#subregion-clip)">
    <rect x="25" y="25" width="100" height="100" fill="#00FF00" filter="url(#full-blur)"/>
  </g>
</svg>
