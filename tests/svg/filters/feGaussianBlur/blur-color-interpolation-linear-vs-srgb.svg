<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="220" height="120" viewBox="0 0 220 120">
  <!--
    Cross-checks: Issue #325 ("Gaussian blur kernel diverges from browser rendering on structured content")
    Spec: W3C Filter Effects 1 § 7.1 ('color-interpolation-filters')
    Invariant: Blur interpolation under explicit color-interpolation-filters="sRGB" operates
               in non-linear sRGB space (matching CSS blur() shorthand), whereas the SVG filter
               default is linearRGB.
               Two abutting red and green rectangles are blurred with stdDeviation="8".
  -->
  <html:link rel="match" href="blur-color-interpolation-linear-vs-srgb-ref.svg"/>
  <defs>
    <filter id="blur-srgb" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Abutting red and green blocks blurred in sRGB space -->
  <g filter="url(#blur-srgb)">
    <rect x="30" y="20" width="80" height="80" fill="#FF0000"/>
    <rect x="110" y="20" width="80" height="80" fill="#00FF00"/>
  </g>
</svg>
