<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <html:link rel="match" href="morphology-edge-detection-ref.svg"/>
  <defs>
    <filter id="f" x="0%" y="0%" width="100%" height="100%">
      <feMorphology in="SourceGraphic" operator="dilate" radius="10" result="dilated"/>
      <feComposite in="dilated" in2="SourceGraphic" operator="out"/>
    </filter>
  </defs>
  <rect x="50" y="50" width="60" height="60" fill="green" filter="url(#f)"/>
</svg>
