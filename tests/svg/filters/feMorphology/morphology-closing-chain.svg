<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <html:link rel="match" href="morphology-closing-chain-ref.svg"/>
  <defs>
    <filter id="f" x="0%" y="0%" width="100%" height="100%">
      <feMorphology operator="dilate" radius="5" result="dilated"/>
      <feMorphology in="dilated" operator="erode" radius="5"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="80" height="80" fill="green" filter="url(#f)"/>
</svg>
