  <html:link rel="match" href="resvg-clippath-multiple-children-ref.svg"/>
    <title>Multiple children</title>

    <clipPath id="clip1">
        <path id="path1" d="M20.000000 75.000000 L81.250000 75.000000 L100.000000 15.000000 L118.750000 75.000000 L180.000000 75.000000 L130.620155 112.984496 L150.000000 175.000000 L100.000000 136.538462 L50.000000 175.000000 L69.379845 112.984496 Z M69.379845 112.984496 L100.000000 136.538462 L130.620155 112.984496 L118.750000 75.000000 L81.250000 75.000000 Z"
              clip-rule="nonzero"/>
        <circle id="circle1" cx="100" cy="100" r="10"/>
    </clipPath>
    <rect id="rect1" x="0" y="0" width="200" height="200" fill="green" clip-path="url(#clip1)"/>

