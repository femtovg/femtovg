<!-- Upstream source: resvg-test-suite/tests/paint-servers/stop/stops-with-equal-offset-2.svg | FemtoVG: Issue #350 (four coincident stops at offset='0.7': first stop controls left side, last stop controls right side) -->
<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200">
  <html:link rel="match" href="resvg-stops-with-equal-offset-2-ref.svg"/>
    <title>Stops with equal `offset` (2)</title>

    <linearGradient id="lg1">
        <stop offset="0" stop-color="red"/>
        <stop offset="0.7" stop-color="yellow"/>
        <stop offset="0.7" stop-color="white"/>
        <stop offset="0.7" stop-color="blue"/>
        <stop offset="0.7" stop-color="green"/>
    </linearGradient>

    <rect id="rect1" x="20" y="20" width="160" height="160" fill="url(#lg1)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
