<!-- Upstream source: resvg-test-suite/tests/paint-servers/stop/stop-with-smaller-offset.svg | FemtoVG: Issue #350 (SVG spec non-decreasing stop rule: stop offset='0.1' after '0.7' is clamped to '0.7' creating a hard transition) -->
<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200">
  <html:link rel="match" href="resvg-stop-with-smaller-offset-monotonic-ref.svg"/>
    <title>Stop with smaller `offset`</title>

    <linearGradient id="lg1">
        <stop offset="0" stop-color="red"/>
        <stop offset="0.7" stop-color="yellow"/>
        <stop offset="0.1" stop-color="green"/>
    </linearGradient>

    <rect id="rect1" x="20" y="20" width="160" height="160" fill="url(#lg1)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
